[project]
name = "agente-de-investigacion-socioeconomica"
version = "0.1.0"
description = "Agente de investigación socioeconómica del Perú: MCP del BCRP y skills de la ENAHO 2024"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
    "httpx",
    "matplotlib>=3.11.2",
    "pandas",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["mcp"]
